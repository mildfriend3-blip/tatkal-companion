name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the suite
        run: python -m unittest discover -s tests -v
      - name: Smoke test the demo
        run: python demo.py
      - name: Install the package and check the entry point
        run: |
          pip install .
          tatkal --help
