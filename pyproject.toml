[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tatkal-companion"
version = "0.6.0"
description = "Local tatkal booking co-pilot for Indian Railways: window timings, reminder plan, readiness checklist, second-by-second pacing and PNR tracking. No IRCTC automation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mild Friend", email = "mildfriend3@gmail.com" }]
keywords = ["irctc", "tatkal", "indian-railways", "pnr", "cli", "travel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = []

[project.scripts]
tatkal = "tatkal.cli:main"
tatkal-dashboard = "tatkal.dashboard:main"

[project.urls]
Homepage = "https://github.com/mildfriend3-blip/tatkal-companion"
Issues = "https://github.com/mildfriend3-blip/tatkal-companion/issues"

[tool.setuptools]
packages = ["tatkal"]
